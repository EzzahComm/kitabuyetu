<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Three-dot group mark above book -->
  <g id="dots">
    <!-- Left green dot -->
    <circle cx="30" cy="15" r="5" fill="#3CB043"/>
    <!-- Center orange dot -->
    <circle cx="50" cy="15" r="5" fill="#F97316"/>
    <!-- Right green dot -->
    <circle cx="70" cy="15" r="5" fill="#3CB043"/>
  </g>

  <!-- Open book icon -->
  <g id="book">
    <!-- Left page -->
    <path d="M 20 35 Q 20 39 24 39 L 40 39 L 40 85 Q 40 89 36 89 L 24 89 Q 20 89 20 85 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 80 35 Q 80 39 76 39 L 60 39 L 60 85 L 76 85 Q 80 85 80 89 L 80 35 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="50" y1="35" x2="50" y2="89" stroke="#3CB043" stroke-width="1.2"/>
  </g>

  <!-- Wordmark text -->
  <g id="wordmark">
    <text x="110" y="75" font-family="Inter, sans-serif" font-size="48" font-weight="700"
          fill="#3CB043" letter-spacing="-1.5">
      KITABU
    </text>
    <text x="280" y="75" font-family="Inter, sans-serif" font-size="48" font-weight="700"
          fill="#F97316" letter-spacing="-1.5">
      YETU
    </text>
  </g>

  <!-- Tagline -->
  <g id="tagline">
    <text x="50" y="105" font-family="Open Sans, sans-serif" font-size="9" font-weight="600"
          fill="#355EFC" letter-spacing="1" text-transform="uppercase">
      COMMUNITY FINANCE
    </text>
  </g>
</svg>