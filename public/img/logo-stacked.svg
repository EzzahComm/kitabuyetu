<svg width="200" height="280" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Three-dot group mark -->
  <g id="dots">
    <!-- Left green dot -->
    <circle cx="70" cy="20" r="8" fill="#3CB043"/>
    <!-- Center orange dot -->
    <circle cx="100" cy="20" r="8" fill="#F97316"/>
    <!-- Right green dot -->
    <circle cx="130" cy="20" r="8" fill="#3CB043"/>
  </g>

  <!-- Open book icon -->
  <g id="book">
    <!-- Left page -->
    <path d="M 60 50 Q 60 55 65 55 L 85 55 L 85 120 Q 85 125 80 125 L 65 125 Q 60 125 60 120 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 140 50 Q 140 55 135 55 L 115 55 L 115 120 L 135 120 Q 140 120 140 125 L 140 50 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="2" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="100" y1="50" x2="100" y2="125" stroke="#3CB043" stroke-width="2"/>
  </g>

  <!-- Wordmark text (stacked) -->
  <g id="wordmark">
    <text x="100" y="160" font-family="Inter, sans-serif" font-size="32" font-weight="700"
          text-anchor="middle" fill="#3CB043" letter-spacing="-1">
      KITABU
    </text>
    <text x="100" y="200" font-family="Inter, sans-serif" font-size="32" font-weight="700"
          text-anchor="middle" fill="#F97316" letter-spacing="-1">
      YETU
    </text>
  </g>

  <!-- Tagline (below stacked wordmark) -->
  <g id="tagline">
    <text x="100" y="250" font-family="Open Sans, sans-serif" font-size="11" font-weight="600"
          text-anchor="middle" fill="#355EFC" letter-spacing="1.5" text-transform="uppercase">
      COMMUNITY FINANCE
    </text>
  </g>
</svg>