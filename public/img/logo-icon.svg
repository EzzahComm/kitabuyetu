<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Three-dot group mark above book -->
  <g id="dots">
    <!-- Left green dot -->
    <circle cx="44" cy="20" r="6" fill="#3CB043"/>
    <!-- Center orange dot -->
    <circle cx="64" cy="20" r="6" fill="#F97316"/>
    <!-- Right green dot -->
    <circle cx="84" cy="20" r="6" fill="#3CB043"/>
  </g>

  <!-- Open book icon -->
  <g id="book">
    <!-- Left page -->
    <path d="M 36 40 Q 36 44 40 44 L 56 44 L 56 88 Q 56 92 52 92 L 40 92 Q 36 92 36 88 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 92 40 Q 92 44 88 44 L 72 44 L 72 88 L 88 88 Q 92 88 92 92 L 92 40 Z"
          fill="#3CB043" stroke="#3CB043" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="64" y1="40" x2="64" y2="92" stroke="#3CB043" stroke-width="1.5"/>
  </g>
</svg>