services:
  postgres:
    image: kitabuyetu-postgres:local
    build:
      context: .
      dockerfile: scripts/docker-init/Postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitabuyetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: kitabuyetu
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U kitabuyetu -d kitabuyetu &&
          psql -U kitabuyetu -d kitabuyetu -Atc
          "SELECT to_regprocedure('public.enforce_member_payout_workflow()') IS NOT NULL" | grep -qx t
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
