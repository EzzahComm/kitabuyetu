version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     kitabuyetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB:       kitabuyetu
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # supabase/migrations/ is the single source of truth — Postgres
      # docker-entrypoint-initdb.d sorts and runs *.sql alphabetically,
      # and the timestamp prefixes preserve the correct ordering.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
      # Layered on top of the mount above (Docker supports nesting a single
      # file mount inside a directory mount) — must sort before every
      # migration's timestamp prefix, hence the "00-" name. See the file for
      # why this is needed.
      - ./scripts/docker-init/00-bootstrap-roles.sql:/docker-entrypoint-initdb.d/00-bootstrap-roles.sql:ro
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U kitabuyetu']
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout:  5s
      retries:  5

volumes:
  postgres_data:
  redis_data:
