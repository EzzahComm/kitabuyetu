name: One-time format cashless PR branch

on:
  push:
    branches:
      - feat/cashless-member-payouts-phase1
    paths:
      - .github/workflows/format-cashless-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format files changed in this PR
        shell: bash
        run: |
          git fetch origin main
          files="$(git diff --name-only origin/main...HEAD | grep -E '\\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss|html)$' || true)"
          if [ -n "$files" ]; then
            printf '%s\\n' "$files" | xargs -r npx prettier --write
          fi
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: format cashless PR files [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
